services:
  - type: web
    name: edgeline
    runtime: node
    plan: free
    # --include=dev is load-bearing: NODE_ENV=production is set below, and npm
    # omits devDependencies when it sees that. vite/esbuild/tsx all live in
    # devDependencies, so without this the build has no build tools.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # Generated by Render; no need to paste one in.
      - key: SESSION_SECRET
        generateValue: true
      # Set these in the Render dashboard — never commit their values.
      - key: DATABASE_URL
        sync: false
      # Sign-in with Google. Without these the API has no accounts and no gate.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # The Google account that owns the journal; also the allowlist's first
      # entry. Unset means nobody can sign in, which is the safe default.
      - key: OWNER_EMAIL
        sync: false
      - key: ALLOWED_EMAILS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
