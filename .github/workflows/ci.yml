name: CI

# Render auto-deploys main, so main going red means production goes red.
# These are the checks that would actually have caught it.
#
# Push and dispatch triggers exist alongside pull_request because the three
# arrive through different pipelines on GitHub's side, and 2026-08-06 proved
# they fail independently: pull_request runs stopped being created for hours
# while push runs sailed through. Belt, braces, and a hand on the waistband.
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]

jobs:
  check:
    runs-on: ubuntu-latest

    # A real Postgres, because the account-isolation tests are the only proof
    # that one person's journal cannot read another's, and a suite that skips
    # them when no database is present would go quietly green the day someone
    # adds an unscoped query.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edgeline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/edgeline_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --include=dev mirrors render.yaml: NODE_ENV=production makes npm drop
      # devDependencies, and vite/esbuild/tsx all live there.
      - name: Install
        run: npm ci --include=dev

      - name: Typecheck
        run: npx tsc --noEmit

      # The shared modules are the app's arithmetic — R, point values, parsing,
      # drawdown. These tests encode every regression found so far.
      - name: Test
        run: npm test

      # Runs the real build script, so a broken vite/esbuild config fails here
      # rather than on Render.
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
